[project]
name = "math-contest-bot"
version = "2.0.0"
description = "Discord bot serving math contest problems (AMC, AIME, USA(J)MO, IMO, CMO, CEMC, COMC, CLMC)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "browser: needs a Playwright Chromium install (skipped automatically when unavailable)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "UP045",  # discord.py reads Optional[...] annotations on command parameters
    "UP007",
]

[tool.ruff.lint.isort]
known-first-party = ["mathbot"]
