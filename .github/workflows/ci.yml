name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (locked)
        run: pip install -r requirements-dev.lock
      - name: Syntax check
        run: python -m compileall -q mathbot tests main.py
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests (offline; fixtures only)
        run: pytest -m "not browser"

  browser:
    # Real Chromium + the pinned MathJax/fonts: proves rendering works offline and
    # that TeX errors and remote resources fail a render instead of slipping through.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies (locked)
        run: pip install -r requirements-dev.lock
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Install pinned render assets
        run: python -m mathbot install-render-assets
      - name: Browser tests
        run: pytest -m browser -rs
